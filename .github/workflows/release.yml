name: release

# Cut a release by pushing a tag:
#   git tag -a v0.3.0 -m "Kayıver 0.3.0" && git push origin v0.3.0
# This builds both binaries and attaches them to the GitHub Release for that
# tag. Write the release notes in the GitHub UI (the release is created as a
# draft so nothing goes public until you publish it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft release after both platform checks pass
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    # Cross-compiled from Linux with mingw, exactly like the local
    # `cargo build --target x86_64-pc-windows-gnu` we deploy from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test -p kayiver-core
      - run: cargo test -p kayiver --features sim --bin kayiver
      - run: cargo test -p kayiver --features sim --test sim_e2e -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: simulated-desk-failure-logs
          path: /tmp/kayiver-sim-*/kayiver.log
      - run: cargo build --locked --release -p kayiver --target x86_64-pc-windows-gnu
      - run: cp target/x86_64-pc-windows-gnu/release/kayiver.exe kayiver-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unverified
          path: kayiver-windows-x64.exe

  windows-security:
    needs: windows
    # This Windows 11 image keeps Defender and Tamper Protection enabled.
    # Static scanning of the x64 PE does not execute it or require an x64 host.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-unverified
          path: candidate
      # Development prereleases retain the existing unsigned Windows channel.
      # The exact file must pass Defender and publishes its verification report.
      # Stable version tags additionally require a trusted Authenticode signature.
      - name: Verify the exact Windows artifact
        shell: pwsh
        run: |
          $publicBuild = '${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}' -eq 'true'
          $versionLine = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0]
          $isDevelopment = $versionLine.Groups[1].Value.EndsWith('-dev')
          $requireSignature = $publicBuild -and -not $isDevelopment
          ./scripts/verify-windows-artifact.ps1 -Path candidate/kayiver-windows-x64.exe -ReportPath windows-verification.json -UpdateSignatures -RequireSignature:$requireSignature
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-security-report
          path: windows-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified
          path: candidate/kayiver-windows-x64.exe

  macos:
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify Apple-silicon executable
        run: |
          test "$(uname -m)" = arm64
          cargo build --locked --release -p kayiver
          test "$(lipo -archs target/release/kayiver)" = arm64

      # Assemble the .app the same way packaging/macos/build-app.sh does, but
      # without touching /Applications or the local keychain.
      - name: Assemble Kayiver.app
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          BUNDLE_VERSION=$(scripts/macos-bundle-version.sh "$VERSION")
          APP=dist/Kayiver.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/kayiver "$APP/Contents/MacOS/kayiver"
          cp assets/icons/Kayiver.icns "$APP/Contents/Resources/Kayiver.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Kayiver</string>
              <key>CFBundleDisplayName</key><string>Kayıver</string>
              <key>CFBundleIdentifier</key><string>app.kayiver</string>
              <key>CFBundleExecutable</key><string>kayiver</string>
              <key>CFBundleIconFile</key><string>Kayiver</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${BUNDLE_VERSION}</string>
              <key>CFBundleVersion</key><string>${BUNDLE_VERSION}</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSUIElement</key><true/>
              <key>NSHumanReadableCopyright</key><string>PolyForm Noncommercial 1.0.0</string>
          </dict>
          </plist>
          PLIST

      # macOS hands Accessibility / Input-Monitoring permission to a SIGNATURE,
      # not to a path. Signing every release with the SAME certificate is what
      # lets an update keep the permissions the user already granted; an
      # ad-hoc signature changes every build, so each update would ask again.
      # Set these two repo secrets to get that (export the "Kayiver Self-Signed"
      # cert as a .p12, then `base64 -i cert.p12 | pbcopy`):
      #   MACOS_CERT_P12       base64 of the .p12
      #   MACOS_CERT_PASSWORD  its password
      - name: Sign Kayiver.app
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::No MACOS_CERT_P12 secret — ad-hoc signing. Users will"
            echo "::warning::have to re-grant Accessibility/Input Monitoring on this update."
            codesign --force --deep --sign - --identifier app.kayiver dist/Kayiver.app
          else
            KC="$RUNNER_TEMP/build.keychain"
            KCPW=$(uuidgen)
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            # Put it in the search list BEFORE importing: set-key-partition-list
            # looks the key up through the search list and fails with "the
            # specified item could not be found" otherwise.
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security unlock-keychain -p "$KCPW" "$KC"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
              -A -T /usr/bin/codesign
            # Stops codesign blocking on a UI prompt that no one can answer.
            # Advisory: -A above already opens the key to every tool.
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KCPW" "$KC" >/dev/null 2>&1 || true
            # NOT `find-identity -v`: our certificate is self-signed, so macOS
            # reports it as CSSMERR_TP_NOT_TRUSTED and the "valid identities"
            # list comes back EMPTY — while codesign signs with it happily.
            HASH=$(security find-identity "$KC" | awk '/\)/ {print $2; exit}')
            test -n "$HASH" || { echo "no signing identity in the keychain"; exit 1; }
            echo "signing with $HASH"
            codesign --force --deep --sign "$HASH" --keychain "$KC" \
              --identifier app.kayiver dist/Kayiver.app
            rm -f "$RUNNER_TEMP/cert.p12"
          fi
          codesign --verify --strict dist/Kayiver.app
          codesign -dv dist/Kayiver.app 2>&1 | grep -i identifier

      - name: Zip the bundle
        run: ditto -c -k --keepParent dist/Kayiver.app Kayiver-macos-arm64.zip
      - name: Create disk image
        run: |
          mkdir -p dmg-root
          ditto dist/Kayiver.app dmg-root/Kayiver.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Kayiver -srcfolder dmg-root -format UDZO Kayiver-macos-arm64.dmg
          hdiutil verify Kayiver-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Kayiver-macos-arm64.zip
            Kayiver-macos-arm64.dmg

  publish:
    needs: [windows-security, macos]
    runs-on: ubuntu-latest
    # Tag builds and explicitly requested manual runs create drafts only.
    # Publication remains a separate step after inspecting exact artifacts.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag from the package version
        id: release
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          package = Path('Cargo.toml').read_text().split('[workspace.package]', 1)[1].split('\n[', 1)[0]
          version = re.search(r'^version\s*=\s*"([^"]+)"', package, re.M).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-dev)?', version):
              raise SystemExit('Unsupported release version')
          tag = 'v' + version
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Release tag must match the package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('tag=' + tag, file=output)
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: windows-verified
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-security-report
      - name: Verify evidence and compute release checksums
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('windows-verification.json').read_text(encoding='utf-8-sig'))
          actual = hashlib.sha256(Path('kayiver-windows-x64.exe').read_bytes()).hexdigest()
          if report.get('passed') is not True or report.get('sha256') != actual:
              raise SystemExit('Windows verification does not match release bytes')
          PYTHON
          sha256sum kayiver-windows-x64.exe Kayiver-macos-arm64.zip Kayiver-macos-arm64.dmg windows-verification.json > SHA256SUMS
      # Draft, so the notes can be written (or edited) before anyone sees it.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ endsWith(steps.release.outputs.tag, '-dev') }}
          name: Kayıver ${{ steps.release.outputs.tag }}
          files: |
            kayiver-windows-x64.exe
            Kayiver-macos-arm64.zip
            Kayiver-macos-arm64.dmg
            windows-verification.json
            SHA256SUMS
